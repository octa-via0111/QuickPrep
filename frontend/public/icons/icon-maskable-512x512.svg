<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cardGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#361658" />
      <stop offset="100%" stop-color="#210C36" />
    </linearGradient>
  </defs>

  <!-- Full 100% Solid Background so Android Never Shows Black Slits -->
  <rect width="512" height="512" fill="#260F3D" />

  <!-- Inner Kotak Card in Safe Zone -->
  <rect x="76" y="76" width="360" height="360" rx="80" fill="url(#cardGradMask)" stroke="#E0623A" stroke-width="5" />

  <!-- White Crossed Utensils Icon -->
  <g transform="translate(256, 210) scale(9.5) translate(-12, -12)">
    <g transform="scale(-1, 1) translate(-24, 0)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m16 2-2.3 2.3a3 3 0 0 0 0 4.2l1.8 1.8a3 3 0 0 0 4.2 0L22 8Z"/>
      <path d="M15 15 3.3 3.3a4.2 4.2 0 0 0 0 6l7.3 7.3c.7.7 2 .7 2.8 0L15 15Zm0 0 7 7"/>
      <path d="m2.1 21.8 6.4-6.3"/>
      <path d="m19 5-7 7"/>
    </g>
  </g>

  <!-- Judul Aplikasi: QuickPrep -->
  <text x="256" y="355" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    <tspan fill="#FFFFFF">Quick</tspan><tspan fill="#E0623A">Prep</tspan>
  </text>
  <!-- Subtitle -->
  <text x="256" y="388" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#BCA9D2" letter-spacing="0.5">
    ASISTEN MASAK PRAKTIS
  </text>
</svg>
